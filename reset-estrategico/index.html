<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Estratégico | Sam Noronha</title>
<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@latest"></script>

<script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    brand: {
                        primary: '#1e3d34',
                        bg: '#f5f1ec',
                        dark: '#181818',
                        accent: '#a9743d',
                    }
                },
                fontFamily: {
                    cinzel: ['"Cinzel Decorative"', 'serif'],
                    montserrat: ['Montserrat', 'sans-serif'],
                }
            }
        }
    }
</script>

<style>
    html {
        scroll-behavior: smooth;
    }
    body {
        background-color: #f5f1ec;
        color: #181818;
        font-family: 'Montserrat', sans-serif;
    }
    
    /* FAQ Transitions */
    .faq-answer {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s ease-out, opacity 0.3s ease-out;
        opacity: 0;
    }
    .faq-item.active .faq-answer {
        max-height: 500px;
        opacity: 1;
        padding-bottom: 1.5rem;
    }
    
    /* Entrance animations */
    .fade-in-up {
        animation: fadeInUp 0.8s ease-out forwards;
    }
    .fade-in-left {
        animation: fadeInLeft 0.8s ease-out forwards;
    }
    
    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeInLeft {
        from { opacity: 0; transform: translateX(-50px); }
        to { opacity: 1; transform: translateX(0); }
    }

    .selection-brand::selection {
        background-color: #a9743d;
        color: white;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
        width: 10px;
    }
    ::-webkit-scrollbar-track {
        background: #f5f1ec;
    }
    ::-webkit-scrollbar-thumb {
        background: #1e3d34;
        border-radius: 5px;
    }
    ::-webkit-scrollbar-thumb:hover {
        background: #a9743d;
    }
</style>

    </body>
</html>
